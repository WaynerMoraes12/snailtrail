[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "snailtrail"
version = "1.0.0"
description = "Every slow query leaves a trail: a MySQL slow-log analyzer and index advisor with a C++20 core"
readme = "python/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wayner Moraes" }]
keywords = ["mysql", "slow-query-log", "performance", "index", "sql", "dba"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
dependencies = []

[project.optional-dependencies]
dashboard = ["fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "pymysql[rsa]>=1.1", "python-multipart>=0.0.9"]
lab = ["pymysql[rsa]>=1.1"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/WaynerMoraes12/snailtrail"

[project.scripts]
snailtrail-dashboard = "snailtrail.dashboard.__main__:main"
snailtrail-lab = "snailtrail.lab.__main__:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.21"
cmake.build-type = "Release"
wheel.packages = ["python/snailtrail"]
sdist.include = ["core", "bindings", "cmake", "CMakeLists.txt", "python"]
sdist.exclude = ["build", "tests", "docker", ".github"]

[tool.scikit-build.cmake.define]
SNAILTRAIL_BUILD_PYTHON = "ON"
SNAILTRAIL_BUILD_TESTS = "OFF"
SNAILTRAIL_BUILD_CLI = "OFF"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
markers = ["mysql: needs a MySQL server (SNAILTRAIL_TEST_MYSQL_DSN, e.g. the Docker lab)"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["×", "µ"]
