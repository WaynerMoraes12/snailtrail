name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 14
            cxx: g++-14
            packages: g++-14
            build_type: Release
          - name: Clang 18
            cxx: clang++-18
            packages: clang-18 g++-14
            build_type: Release
          - name: ASan + UBSan
            cxx: g++-14
            packages: g++-14
            build_type: Debug
            cmake_args: -DSNAILTRAIL_SANITIZE=ON
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ matrix.packages }}
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DSNAILTRAIL_WARNINGS_AS_ERRORS=ON
          ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4
      - name: Analyse a generated log and publish the report
        if: matrix.name == 'GCC 14'
        run: |
          build/cli/snailtrail generate --events 200000 --output slow.log
          build/cli/snailtrail analyze slow.log --schema samples/shop_schema.sql --top 10 --details 5 --no-color
          build/cli/snailtrail analyze slow.log --schema samples/shop_schema.sql --top 10 --details 5 \
            --format markdown >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DSNAILTRAIL_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --parallel 4

  macos:
    name: macOS (Apple Clang)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSNAILTRAIL_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

  python:
    name: Python and MySQL
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install the package
        env:
          CXX: g++-14
        run: python -m pip install ".[dashboard,lab,dev]"
      - name: Lint
        run: ruff check python && ruff format --check python
      - name: Test
        env:
          SNAILTRAIL_TEST_MYSQL_DSN: mysql://root:ci@127.0.0.1:3306/unused
        run: python -m pytest -v python/tests

  lab:
    name: Docker lab end to end
    runs-on: ubuntu-24.04
    env:
      LAB_SCALE: tiny
      LAB_ITERATIONS: "800"
      ANALYZE_EVERY: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Build the images
        run: docker compose --profile tools build
      - name: Start MySQL, run the lab, start the dashboard
        run: docker compose up -d dashboard
      - name: Analyse through the dashboard
        run: |
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 2; done
          curl -fsS -X POST http://127.0.0.1:8080/api/analyze | tee run.json
          run_id=$(python3 -c "import json; print(json.load(open('run.json'))['run_id'])")
          curl -fsS "http://127.0.0.1:8080/api/runs/$run_id" > report.json
          python3 - <<'EOF'
          import json
          report = json.load(open("report.json"))
          classes = report["classes"]
          rules = {f["rule_id"] for c in classes for f in c["findings"]}
          print(f"{report['run']['events']} events, {len(classes)} classes, rules {sorted(rules)}")
          assert report["run"]["events"] > 500
          assert {"ST001", "ST005", "ST006", "ST014"} <= rules
          assert any(c["plan"] for c in classes)
          EOF
          curl -fsS "http://127.0.0.1:8080/runs/$run_id" | grep -q "of query time in"
      - name: Analyse the lab's log with the CLI image
        run: docker compose run --rm cli analyze /logs/slow.log --schema /samples/shop_schema.sql --top 5 --details 1
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
